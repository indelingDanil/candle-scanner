<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; background: #15181e; color: #e6e8eb; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #2f80ed; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #2a6fcc; }
  p { color: #9aa3ad; font-size: 11px; line-height: 1.4; margin: 10px 0 0; }
  #err { color: #ff6b6b; }
</style>
</head>
<body>
  <h1>Candle Scanner</h1>
  <button id="open"></button>
  <p id="err"></p>
  <p id="note"></p>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
